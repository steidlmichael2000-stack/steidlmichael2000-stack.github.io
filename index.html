<!-- ═══════════════════════════════════════════════════════════════════
     WEICHE AUF DER WURZEL

     Diese Seite ist absichtlich nur noch eine Weiterleitung und trägt
     KEIN Manifest. Der Grund: ein Scope muss die eigene start_url
     enthalten. Läge MS Tools weiterhin hier, wäre sein Scope "/" — und
     Chrome rechnet jede Seite im Scope einer installierten App dieser App
     zu. Die vier Apps liessen sich dann nicht mehr einzeln installieren,
     Chrome bot statt der Installation nur "in MS Tools öffnen" an.
     MS Tools liegt deshalb unter /start/ mit eigenem, engem Scope.

     Zwei Fälle landen hier:

     1. Die alte Stundenplan-App war einmal unter "/" als PWA installierbar
        und liegt so noch auf manchen Homescreens. Im Standalone-Modus wird
        deshalb direkt in den Stundenplan weitergeleitet, damit dieses Icon
        weiterhin dort landet, wo es hingehört.
     2. Alle anderen — Aufrufe im Browser und die alte start_url "/?home=1"
        aus Installationen von vor dem Umzug — gehen nach /start/.

     Läuft als erstes Skript im <head>, damit nichts aufblitzt.
     ═══════════════════════════════════════════════════════════════════ -->
<script>
(function () {
  var ziel = 'start/';
  try {
    var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
      || navigator.standalone;
    if (standalone && !location.search.includes('home')) ziel = 'stundenplan/';
  } catch (e) { /* im Zweifel zu MS Tools */ }
  location.replace(ziel);
})();
</script>
