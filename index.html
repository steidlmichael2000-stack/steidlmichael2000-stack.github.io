<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FST 1 Stundenplan</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1117">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FST 1">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500;700&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: rgba(255,255,255,0.07);
    --text: #e8eaf0;
    --muted: #6b7280;
    --accent: #f59e0b;
    --accent2: #3b82f6;
    --green: #10b981;
    --g1: #a78bfa;
    --g2: #f472b6;
    --active-glow: rgba(245,158,11,0.15);
    --mono: 'DM Mono', monospace;
    --sans: 'DM Sans', sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    font-family: var(--sans);
    color: var(--text);
    min-height: 100vh;
    padding: 16px 14px 40px;
    background-image:
      radial-gradient(circle at 20% 20%, rgba(59,130,246,0.04) 0%, transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(245,158,11,0.04) 0%, transparent 50%);
  }

  /* ── Group Selector overlay ── */
  #group-overlay {
    position: fixed; inset: 0; z-index: 999;
    background: rgba(10,11,16,0.95);
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 20px;
    backdrop-filter: blur(8px);
  }
  #group-overlay h2 { font-size: 1.4rem; font-weight: 700; text-align: center; }
  #group-overlay p  { color: var(--muted); font-size: 0.85rem; text-align: center; max-width: 280px; }
  .group-btns { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  .group-btn {
    padding: 18px 32px;
    border-radius: 14px;
    border: 2px solid;
    font-family: var(--sans);
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    background: transparent;
    transition: all 0.2s;
  }
  .group-btn.g1 { color: var(--g1); border-color: var(--g1); }
  .group-btn.g1:hover { background: rgba(167,139,250,0.12); }
  .group-btn.g2 { color: var(--g2); border-color: var(--g2); }
  .group-btn.g2:hover { background: rgba(244,114,182,0.12); }

  /* ── Header ── */
  .header {
    display: flex; align-items: center;
    justify-content: space-between;
    flex-wrap: wrap; gap: 10px;
    margin-bottom: 14px;
  }
  .header-left h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: -0.02em; }
  .header-left h1 span { color: var(--accent); }
  .header-left p { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }
  .header-right { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  .clock {
    font-family: var(--mono);
    font-size: 1.25rem;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 7px 13px;
    border-radius: 10px;
    color: var(--accent);
    letter-spacing: 0.04em;
    white-space: nowrap;
  }

  /* group badge */
  .group-badge {
    font-size: 0.75rem; font-weight: 700;
    padding: 5px 12px; border-radius: 999px;
    border: 1px solid; cursor: pointer;
    transition: all 0.2s; white-space: nowrap;
    font-family: var(--sans);
    background: transparent;
  }
  .group-badge.g1 { color: var(--g1); border-color: var(--g1); }
  .group-badge.g1:hover { background: rgba(167,139,250,0.12); }
  .group-badge.g2 { color: var(--g2); border-color: var(--g2); }
  .group-badge.g2:hover { background: rgba(244,114,182,0.12); }

  /* week type pill */
  .week-pill {
    font-size: 0.72rem; font-weight: 600;
    padding: 5px 11px; border-radius: 999px;
    background: rgba(245,158,11,0.1);
    color: var(--accent);
    border: 1px solid rgba(245,158,11,0.25);
    white-space: nowrap;
  }
  .week-pill.b { background: rgba(59,130,246,0.1); color: var(--accent2); border-color: rgba(59,130,246,0.25); }

  /* ferien notice */
  .ferien-banner {
    background: rgba(16,185,129,0.07);
    border: 1px solid rgba(16,185,129,0.2);
    border-radius: 12px; padding: 12px 16px;
    margin-bottom: 14px; font-size: 0.85rem;
    color: var(--green); font-weight: 500;
    display: none;
  }

  /* ── Status Card ── */
  .status-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 14px 18px;
    margin-bottom: 16px;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    transition: border-color 0.4s; position: relative; overflow: hidden;
  }
  .status-card::before {
    content: ''; position: absolute; inset: 0;
    background: var(--active-glow); opacity: 0;
    transition: opacity 0.4s; pointer-events: none;
  }
  .status-card.has-lesson::before { opacity: 1; }
  .status-card.has-lesson { border-color: rgba(245,158,11,0.35); }
  .status-card.has-pause::before { background: rgba(59,130,246,0.08); opacity: 1; }
  .status-card.has-pause  { border-color: rgba(59,130,246,0.35); }

  .status-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--muted); flex-shrink: 0;
  }
  .status-dot.active { background: var(--accent); animation: ripple 1.6s ease-out infinite; }
  .status-dot.pause  { background: var(--accent2); animation: ripple-blue 1.6s ease-out infinite; }
  @keyframes ripple      { 0%,100%{box-shadow:0 0 0 0 rgba(245,158,11,.5)} 50%{box-shadow:0 0 0 8px rgba(245,158,11,0)} }
  @keyframes ripple-blue { 0%,100%{box-shadow:0 0 0 0 rgba(59,130,246,.5)} 50%{box-shadow:0 0 0 8px rgba(59,130,246,0)} }

  .status-text { flex: 1; }
  .status-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
  .status-main  { font-size: 1rem; font-weight: 600; margin-top: 2px; }
  .status-sub   { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }

  .countdown-pill {
    font-family: var(--mono); font-size: 0.85rem;
    background: rgba(245,158,11,0.12); color: var(--accent);
    border: 1px solid rgba(245,158,11,0.25);
    padding: 6px 13px; border-radius: 999px;
    white-space: nowrap; letter-spacing: 0.04em; transition: all 0.3s;
  }
  .countdown-pill.blue { background: rgba(59,130,246,0.12); color: var(--accent2); border-color: rgba(59,130,246,0.25); }
  .countdown-pill.hidden { opacity: 0; pointer-events: none; }

  /* ── Table ── */
  .table-wrap {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; overflow: hidden; overflow-x: auto;
  }
  table { width: 100%; border-collapse: collapse; min-width: 580px; }
  col.time-col { width: 82px; }

  thead tr th {
    background: var(--surface2); padding: 9px 6px;
    font-size: 0.68rem; font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 2;
  }
  thead tr th.today-head { color: var(--accent); background: rgba(245,158,11,0.06); }

  td { border: 1px solid var(--border); padding: 0; text-align: center; vertical-align: middle; transition: background 0.25s; }

  .time-cell {
    background: var(--surface2); font-family: var(--mono);
    font-size: 12px; font-weight: 700; color: var(--text);
    padding: 5px 7px; line-height: 1.6; text-align: left;
    border-right: 1px solid var(--border) !important;
  }
  .time-cell .hour-nr { display: block; font-size: 9px; color: rgba(255,255,255,0.18); margin-bottom: 1px; }

  .lesson-cell { height: 54px; padding: 5px 3px; }
  .lesson-cell .subj { font-size: 11px; font-weight: 600; color: var(--text); display: block; line-height: 1.2; }
  .lesson-cell .info { font-size: 9.5px; color: var(--muted); margin-top: 3px; display: block; line-height: 1.4; }
  .lesson-cell.today-col { background: rgba(255,255,255,0.02); }
  .lesson-cell.active { background: rgba(245,158,11,0.12) !important; border-color: rgba(245,158,11,0.3) !important; }
  .lesson-cell.active .subj { color: var(--accent); }

  .pause-cell {
    height: 8px; padding: 0;
    font-size: 8px; color: rgba(255,255,255,0.12);
    letter-spacing: 0.08em; text-transform: uppercase;
  }
  .pause-cell.today-col { background: rgba(255,255,255,0.01); }
  .pause-cell.active { background: rgba(59,130,246,0.12) !important; border-color: rgba(59,130,246,0.25) !important; color: var(--accent2) !important; font-weight: 600; }

  .lunch-cell {
    height: 54px; background: rgba(16,185,129,0.06);
    font-size: 9.5px; font-weight: 600; color: rgba(16,185,129,0.5);
    letter-spacing: 0.05em; text-transform: uppercase;
  }
  .lunch-cell.today-col { background: rgba(16,185,129,0.09); color: rgba(16,185,129,0.7); }
  .lunch-cell.active { background: rgba(16,185,129,0.18) !important; color: var(--green) !important; animation: lunchPulse 2s ease-in-out infinite; }
  @keyframes lunchPulse { 0%,100%{opacity:1} 50%{opacity:0.75} }

  .free-cell { height: 54px; }
  .free-cell.today-col { background: rgba(255,255,255,0.01); }

  .weekend-banner {
    text-align: center; padding: 12px;
    font-size: 0.85rem; color: var(--green);
    background: rgba(16,185,129,0.07);
    border: 1px solid rgba(16,185,129,0.15);
    border-radius: 10px; margin-bottom: 14px;
    font-weight: 500; display: none;
  }

  /* Tooltips */
  [data-tip] { position: relative; }
  [data-tip]:hover::after {
    content: attr(data-tip);
    position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%);
    background: #0a0c12; color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 5px 10px; font-size: 11px;
    white-space: nowrap; z-index: 100; pointer-events: none;
    font-family: var(--sans); box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }

  .table-wrap::-webkit-scrollbar { height: 4px; }
  .table-wrap::-webkit-scrollbar-track { background: transparent; }
  .table-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .loading-hint { font-size: 0.75rem; color: var(--muted); text-align: center; padding: 8px; }
</style>
</head>
<body>

<!-- Group Selection Overlay -->
<div id="group-overlay">
  <h2>Welche Gruppe bist du?</h2>
  <p>Die Auswahl wird gespeichert und kann jederzeit oben geändert werden.</p>
  <div class="group-btns">
    <button class="group-btn g1" onclick="selectGroup(1)">Gruppe 1</button>
    <button class="group-btn g2" onclick="selectGroup(2)">Gruppe 2</button>
  </div>
</div>

<div class="header">
  <div class="header-left">
    <h1>FST <span>1</span></h1>
    <p>Josef-Greising-Schule · Stundenplan</p>
  </div>
  <div class="header-right">
    <span class="week-pill" id="week-pill">Woche A</span>
    <button class="group-badge g1" id="group-badge" onclick="showGroupOverlay()">Gruppe 1</button>
    <div class="clock" id="live-clock">--:--:--</div>
  </div>
</div>

<div id="weekend-banner" class="weekend-banner">🎉 Wochenende – genieß die freie Zeit!</div>
<div id="ferien-banner" class="ferien-banner">🏖️ Schulferien – gute Erholung!</div>
<div id="loading-hint" class="loading-hint">⏳ Lade Feriendaten…</div>

<div class="status-card" id="status-card">
  <div class="status-dot" id="status-dot"></div>
  <div class="status-text">
    <div class="status-label" id="status-label">Status</div>
    <div class="status-main"  id="status-main">–</div>
    <div class="status-sub"   id="status-sub"></div>
  </div>
  <div class="countdown-pill hidden" id="countdown-pill">00:00</div>
</div>

<div class="table-wrap">
  <table id="plan-table">
    <colgroup><col class="time-col"><col><col><col><col><col></colgroup>
    <thead>
      <tr>
        <th>Zeit</th>
        <th id="head-0">Mo</th><th id="head-1">Di</th>
        <th id="head-2">Mi</th><th id="head-3">Do</th><th id="head-4">Fr</th>
      </tr>
    </thead>
    <tbody id="plan-body"></tbody>
  </table>
</div>

<script>
// ══════════════════════════════════════════════════════
//  DATA
// ══════════════════════════════════════════════════════
const PLAN = [
  { type:'hour', nr:1,  start:[8,0],   end:[8,45]  },
  { type:'hour', nr:2,  start:[8,45],  end:[9,30]  },
  { type:'pause',       start:[9,30],  end:[9,45]  },
  { type:'hour', nr:3,  start:[9,45],  end:[10,30] },
  { type:'hour', nr:4,  start:[10,30], end:[11,15] },
  { type:'pause',       start:[11,15], end:[11,30] },
  { type:'hour', nr:5,  start:[11,30], end:[12,15] },
  { type:'hour', nr:6,  start:[12,15], end:[13,0]  },
  { type:'hour', nr:7,  start:[13,0],  end:[13,45] },
  { type:'hour', nr:8,  start:[13,45], end:[14,30] },
  { type:'hour', nr:9,  start:[14,30], end:[15,15] },
  { type:'pause',       start:[15,15], end:[15,30] },
  { type:'hour', nr:10, start:[15,30], end:[16,15] },
  { type:'hour', nr:11, start:[16,15], end:[17,0]  },
];

// Mittagspause: day(0=Mo) → lesson nr
const LUNCH = { 0:8, 1:7, 2:7, 3:5 };

const FACH_FULL = {
  'Baukonstr':'Baukonstruktion','Bautechno':'Bautechnologie',
  'Wi_PuG':'Wirtschaft, Politik & Gesellschaft','Statik':'Statik & Festigkeitslehre',
  'Bauphysik':'Bauphysik','Baurecht':'Baurecht','Betr-psych':'Betriebspsychologie',
  'CAD/Verm':'CAD & Vermessung','CAD/Lab':'CAD-Labor','EDV':'EDV','EDV/Lab':'EDV-Labor',
  'Darst.G':'Darstellende Geometrie','Vermess':'Vermessung',
  'Mathe':'Mathematik','Englisch':'Englisch','Deutsch':'Deutsch',
};

// Gemeinsame Fächer (identisch für alle Gruppen/Wochen)
const COMMON = {
  0: {1:['Baukonstr','E 203','Reißer'],  2:['Baukonstr','E 203','Reißer'],
      3:['Bautechno','E 203','Drexler'], 4:['Bautechno','E 203','Drexler'],
      5:['Bautechno','E 203','Drexler'], 6:['Wi_PuG','E 203','Seiler'],
      7:['Wi_PuG','E 203','Seiler'],     9:['Deutsch','E 202','Schnabel'],
     10:['Deutsch','E 203','Schnabel']},
  1: {2:['Statik','E 203','Schäfer'],    3:['Statik','E 203','Schäfer'],
      4:['Statik','E 203','Schäfer'],    5:['Englisch','E 203','Finck'],
      6:['Englisch','E 203','Finck'],    8:['Bauphysik','E 203','Küsel'],
      9:['Bauphysik','E 203','Küsel'],  10:['Bauphysik','E 203','Küsel']},
  // Mi/Do werden je nach Gruppe/Woche unten befüllt
  2: {1:['Mathe','E 203','Hinte'],       2:['Mathe','E 203','Hinte'],
      3:['Baurecht','E 203','Carl'],     4:['Baurecht','E 203','Carl'],
      5:['Betr-psych','E 203','Papsdorf'],6:['Betr-psych','E 203','Papsdorf']},
  3: {6:['Mathe','E 203','Hinte'],       7:['Mathe','E 203','Hinte'],
      8:['Mathe','E 203','Hinte']},
  4: {1:['Darst.G','E 203','Schwemmer'],2:['Darst.G','E 203','Schwemmer'],
      3:['Baukonstr','E 203','Reißer'], 4:['Baukonstr','E 203','Reißer']},
};

function getSchedule(group, weekType) {
  const s = JSON.parse(JSON.stringify(COMMON));

  // ── Mittwoch: split CAD (Summerer) vs. Vermessung (Schwind) ──
  // Gruppe 1 Woche A  → CAD
  // Gruppe 1 Woche B  → Vermessung
  // Gruppe 2 Woche A  → Vermessung
  // Gruppe 2 Woche B  → CAD  (spiegelverkehrt)
  const miCAD  = (group === 1 && weekType === 'A') || (group === 2 && weekType === 'B');
  if (miCAD) {
    // CAD-Woche: Stunden 8+9, Schulschluss 15:15 → keine 10+11
    s[2][8] = ['CAD','E 103','Summerer'];
    s[2][9] = ['CAD','E 103','Summerer'];
    // (keine Stunden 10+11)
  } else {
    // Vermessungs-Woche: Stunden 8+9+10+11
    s[2][8]  = ['Vermess','E 203','Schwind'];
    s[2][9]  = ['Vermess','E 203','Schwind'];
    s[2][10] = ['Vermess','E 203','Schwind'];
    s[2][11] = ['Vermess','E 203','Schwind'];
  }

  // ── Donnerstag: split EDV (Reith) vs. Lab/CAD-Labor (Wolf) ──
  // Gruppe 1 Woche A  → Lab (Wolf), kein 1. Std (Beginn 08:45)
  // Gruppe 1 Woche B  → EDV (Reith), 1. Std vorhanden
  // Gruppe 2 Woche A  → EDV (Reith), 1. Std vorhanden
  // Gruppe 2 Woche B  → Lab (Wolf), kein 1. Std
  const doLab = (group === 1 && weekType === 'A') || (group === 2 && weekType === 'B');
  if (doLab) {
    // Lab-Woche: kein 1. Std (Beginn 08:45), Labor Std 2–4
    s[3][2] = ['Labor','E 103','Wolf'];
    s[3][3] = ['Labor','E 103','Wolf'];
    s[3][4] = ['Labor','E 103','Wolf'];
  } else {
    // EDV-Woche: Std 1+2 EDV, dann nach Pause Std 3+4 CAD-Labor
    s[3][1] = ['EDV','E 203','Reith'];
    s[3][2] = ['EDV','E 203','Reith'];
    s[3][3] = ['CAD-Labor','E 103','Wolf'];
    s[3][4] = ['CAD-Labor','E 103','Wolf'];
  }

  // ── Freitag: EDV nur bei Gruppe 1 Woche A / Gruppe 2 Woche B ──
  const frEDV = (group === 1 && weekType === 'A') || (group === 2 && weekType === 'B');
  if (frEDV) {
    s[4][5] = ['EDV','E 203','Reith'];
    s[4][6] = ['EDV','E 203','Reith'];
  }

  return s;
}

// Lunch overrides per group/weekType/day
function getLunch(group, weekType) {
  const l = Object.assign({}, LUNCH);
  // Gruppe 1 Woche A: Mi endet nach Std 9 → keine Mittagspause (Std 7 wäre LUNCH[2]=7, aber Std 10/11 fehlen so oder so)
  // Do: kein 1. Std → Mittagspause bleibt bei Std 5 (LUNCH[3]=5), passt
  return l;
}

// ══════════════════════════════════════════════════════
//  FERIEN
// ══════════════════════════════════════════════════════
let ferienRanges = []; // [{start: Date, end: Date}]
let ferienLoaded = false;

async function loadFerien() {
  const years = [new Date().getFullYear(), new Date().getFullYear() + 1];
  const all = [];
  for (const y of years) {
    try {
      const r = await fetch(`https://schulferien-api.de/api/v1/${y}/BY/`);
      if (!r.ok) continue;
      const data = await r.json();
      data.forEach(f => {
        if (f.start && f.end) {
          all.push({ start: new Date(f.start), end: new Date(f.end) });
        }
      });
    } catch(e) { /* offline – ignore */ }
  }
  ferienRanges = all;
  ferienLoaded = true;
  document.getElementById('loading-hint').style.display = 'none';
}

function isFerien(date) {
  const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
  return ferienRanges.some(f => {
    const s = new Date(f.start.getFullYear(), f.start.getMonth(), f.start.getDate());
    const e = new Date(f.end.getFullYear(), f.end.getMonth(), f.end.getDate());
    return d >= s && d <= e;
  });
}

// ══════════════════════════════════════════════════════
//  WEEK TYPE LOGIC
//  Referenz: KW der Woche 23.02.2026 = Gruppe 1 → Woche A
//  Ferienwochen werden nicht gezählt.
// ══════════════════════════════════════════════════════
const ANCHOR_DATE  = new Date(2026, 1, 23); // Mo 23.02.2026
const ANCHOR_GROUP1_TYPE = 'A'; // Gruppe 1 hat in dieser Woche A

function getMondayOf(date) {
  const d = new Date(date);
  const day = d.getDay(); // 0=Sun
  const diff = (day === 0) ? -6 : 1 - day;
  d.setDate(d.getDate() + diff);
  d.setHours(0,0,0,0);
  return d;
}

// Zählt Schulwochen (keine Ferienwochen) zwischen anchorMonday und targetMonday
function countSchoolWeeksBetween(anchorMon, targetMon) {
  let count = 0;
  const step = anchorMon <= targetMon ? 1 : -1;
  let cur = new Date(anchorMon);
  while (cur.getTime() !== targetMon.getTime()) {
    cur.setDate(cur.getDate() + 7 * step);
    // Prüfe ob diese Woche Ferien sind (mind. Mo ist Ferientag)
    if (!isFerien(cur)) count++;
    else if (cur.getTime() === targetMon.getTime()) {
      // Zielwoche selbst – nicht zählen, da sie selbst bewertet wird
    }
  }
  return count * step;
}

function getWeekType(group, date) {
  const anchorMon = getMondayOf(ANCHOR_DATE);
  const targetMon = getMondayOf(date);

  let weeks;
  if (ferienLoaded) {
    weeks = countSchoolWeeksBetween(anchorMon, targetMon);
  } else {
    // Fallback: einfache Kalenderwochendifferenz (ohne Ferien-Skip)
    const diffMs = targetMon.getTime() - anchorMon.getTime();
    weeks = Math.round(diffMs / (7 * 24 * 60 * 60 * 1000));
  }

  const isEven = (((weeks % 2) + 2) % 2) === 0;
  // Immer Gruppe-1-Perspektive zurückgeben.
  // getSchedule() kümmert sich selbst um die Gruppendifferenzierung.
  return isEven ? 'A' : 'B';
}

// ══════════════════════════════════════════════════════
//  GROUP STATE
// ══════════════════════════════════════════════════════
let currentGroup = parseInt(localStorage.getItem('fst1_group') || '0');

function selectGroup(g) {
  currentGroup = g;
  localStorage.setItem('fst1_group', g);
  document.getElementById('group-overlay').style.display = 'none';
  updateGroupBadge();
  buildTable();
  update();
}

function showGroupOverlay() {
  document.getElementById('group-overlay').style.display = 'flex';
}

function updateGroupBadge() {
  const badge = document.getElementById('group-badge');
  badge.textContent = `Gruppe ${currentGroup}`;
  badge.className = `group-badge g${currentGroup}`;
}

// ══════════════════════════════════════════════════════
//  TABLE BUILD
// ══════════════════════════════════════════════════════
function buildTable() {
  const tbody = document.getElementById('plan-body');
  tbody.innerHTML = '';

  const now = new Date();
  const wt  = getWeekType(currentGroup, now);
  const sch = getSchedule(currentGroup, wt);
  const lun = getLunch(currentGroup, wt);

  PLAN.forEach((slot, rowIdx) => {
    const tr = document.createElement('tr');
    tr.dataset.row = rowIdx;

    // Time cell
    const tc = document.createElement('td');
    tc.className = 'time-cell';
    if (slot.type === 'hour') {
      tc.innerHTML = `<span class="hour-nr">${slot.nr}.</span>${fmt(slot.start)}<br>${fmt(slot.end)}`;
    } else {
      tc.innerHTML = `${fmt(slot.start)}<br>${fmt(slot.end)}`;
    }
    tr.appendChild(tc);

    for (let d = 0; d < 5; d++) {
      const td = document.createElement('td');
      td.dataset.day = d; td.dataset.row = rowIdx;

      if (slot.type === 'pause') {
        td.className = 'pause-cell';
      } else if (slot.type === 'hour' && lun[d] === slot.nr) {
        td.className = 'lunch-cell';
        td.innerHTML = `Mittags-<br>pause`;
      } else if (slot.type === 'hour') {
        const info = sch[d]?.[slot.nr];
        if (info) {
          const full = FACH_FULL[info[0]] || info[0];
          td.className = 'lesson-cell';
          td.setAttribute('data-tip', `${full} · ${info[2]}`);
          td.innerHTML = `<span class="subj">${info[0]}</span><span class="info">${info[2]}<br>${info[1]}</span>`;
        } else {
          td.className = 'free-cell';
        }
      }
      tr.appendChild(td);
    }
    tbody.appendChild(tr);
  });
}

// ══════════════════════════════════════════════════════
//  UPDATE LOOP
// ══════════════════════════════════════════════════════
function update() {
  if (!currentGroup) return;

  const now    = new Date();
  const dayJs  = now.getDay();
  const dayIdx = dayJs - 1;
  const nowM   = now.getHours() * 60 + now.getMinutes();
  const nowS   = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();

  document.getElementById('live-clock').textContent =
    `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;

  // Week type (wt = immer Gruppe-1-Perspektive für Schedule-Logik)
  const wt = getWeekType(currentGroup, now);
  // Anzeige-Wochentyp: Gruppe 2 sieht das Gegenteil
  const displayWt = currentGroup === 1 ? wt : (wt === 'A' ? 'B' : 'A');
  const pill = document.getElementById('week-pill');
  if (displayWt === 'A') {
    pill.textContent = `Woche A`;
    pill.className = 'week-pill';
  } else {
    pill.textContent = `Woche B`;
    pill.className = 'week-pill b';
  }

  // Today headers
  for (let d = 0; d < 5; d++) {
    document.getElementById(`head-${d}`).className = d === dayIdx ? 'today-head' : '';
  }

  const isWeekend = dayJs === 0 || dayJs === 6;
  const inFerien  = ferienLoaded && isFerien(now);

  document.getElementById('weekend-banner').style.display = isWeekend ? '' : 'none';
  document.getElementById('ferien-banner').style.display  = !isWeekend && inFerien ? '' : 'none';
  document.getElementById('status-card').style.display    = (isWeekend || inFerien) ? 'none' : '';

  if (isWeekend || inFerien) { highlightColumn(-1, -1); return; }

  // Current schedule
  const sch = getSchedule(currentGroup, wt);
  const lun = getLunch(currentGroup, wt);

  // Find active slot
  let activeRow = -1, activeType = 'free', secsLeft = 0;
  PLAN.forEach((slot, rowIdx) => {
    const startM = toMins(slot.start), endM = toMins(slot.end);
    const endS   = endM * 60;
    if (nowM >= startM && nowM < endM) {
      activeRow = rowIdx; activeType = slot.type;
      secsLeft = endS - nowS;
      if (secsLeft < 0) secsLeft = 0;
    }
  });

  highlightColumn(dayIdx, activeRow);

  // Status card
  const card  = document.getElementById('status-card');
  const dot   = document.getElementById('status-dot');
  const label = document.getElementById('status-label');
  const main  = document.getElementById('status-main');
  const sub   = document.getElementById('status-sub');
  const cpill = document.getElementById('countdown-pill');

  card.className = 'status-card';
  dot.className  = 'status-dot';
  cpill.className = 'countdown-pill';

  if (activeRow === -1) {
    label.textContent = 'Außerhalb der Schulzeit';
    main.textContent  = 'Keine aktive Stunde';
    sub.textContent   = ''; cpill.classList.add('hidden');
  } else if (activeType === 'pause') {
    card.classList.add('has-pause'); dot.classList.add('pause');
    label.textContent = 'Jetzt';
    main.textContent  = '☕ Pause';
    sub.textContent   = `Bis ${fmt(PLAN[activeRow].end)} Uhr`;
    cpill.classList.add('blue');
    cpill.textContent = fmtCD(secsLeft);
  } else {
    const slot    = PLAN[activeRow];
    const isLunch = dayIdx >= 0 && lun[dayIdx] === slot.nr;
    if (isLunch) {
      card.classList.add('has-pause'); dot.classList.add('pause');
      label.textContent = 'Jetzt'; main.textContent = '🍴 Mittagspause';
      sub.textContent   = `Bis ${fmt(slot.end)} Uhr`;
      cpill.classList.add('blue'); cpill.textContent = fmtCD(secsLeft);
    } else {
      const info = sch[dayIdx]?.[slot.nr];
      card.classList.add('has-lesson'); dot.classList.add('active');
      label.textContent = `${slot.nr}. Stunde`;
      if (info) {
        main.textContent = FACH_FULL[info[0]] || info[0];
        sub.textContent  = `${info[2]} · ${info[1]}`;
      } else {
        main.textContent = 'Freistunde'; sub.textContent = '';
      }
      cpill.textContent = fmtCD(secsLeft);
    }
  }
}

function highlightColumn(dayIdx, activeRow) {
  document.querySelectorAll('#plan-body td[data-day]').forEach(td => {
    const d = parseInt(td.dataset.day);
    const r = parseInt(td.dataset.row);
    const isToday  = d === dayIdx;
    const isActive = isToday && r === activeRow;
    const base = td.className.replace(/ today-col| active/g, '');
    td.className = base + (isToday ? ' today-col' : '') + (isActive ? ' active' : '');
  });
}

// ══════════════════════════════════════════════════════
//  HELPERS
// ══════════════════════════════════════════════════════
function pad(n) { return String(n).padStart(2,'0'); }
function fmt([h,m]) { return `${pad(h)}:${pad(m)}`; }
function toMins([h,m]) { return h*60+m; }
function fmtCD(s) { return `${pad(Math.floor(s/60))}:${pad(s%60)}`; }

// ══════════════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════════════
(async () => {
  await loadFerien();
  if (currentGroup) {
    document.getElementById('group-overlay').style.display = 'none';
    updateGroupBadge();
    buildTable();
  }
  update();
  function tick() { update(); setTimeout(tick, 1000 - (Date.now() % 1000)); }
  setTimeout(tick, 1000 - (Date.now() % 1000));
})();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js');
}
</script>
