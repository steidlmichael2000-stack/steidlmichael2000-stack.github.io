<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FST 1 Stundenplan</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1117">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1117; --surface: #1a1d27; --surface2: #22263a;
    --border: rgba(255,255,255,0.07); --text: #e8eaf0; --muted: #6b7280;
    --accent: #f59e0b; --accent2: #3b82f6; --green: #10b981;
    --mono: 'DM Mono', monospace; --sans: 'DM Sans', sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); font-family: var(--sans); color: var(--text);
    min-height: 100vh; padding: 20px 16px 40px;
    background-image: radial-gradient(circle at 20% 20%, rgba(59,130,246,0.04) 0%, transparent 50%);
  }

  /* ── Header & Group Switcher ──────────────── */
  .header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
  .header-left h1 { font-size: 1.5rem; font-weight: 700; }
  .header-left h1 span { color: var(--accent); }
  
  .group-switch {
    display: flex; background: var(--surface); border: 1px solid var(--border);
    padding: 4px; border-radius: 12px; gap: 4px;
  }
  .group-btn {
    padding: 6px 12px; border: none; background: transparent; color: var(--muted);
    border-radius: 8px; font-weight: 600; font-size: 0.8rem; cursor: pointer; transition: 0.2s;
  }
  .group-btn.active { background: var(--accent); color: #000; }

  /* Restlicher Style (Status Card, Table etc.) bleibt wie vorher */
  .clock { font-family: var(--mono); font-size: 1.1rem; color: var(--accent); margin-bottom: 10px; }
  .status-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 20px; display: flex; align-items: center; gap: 16px; }
  .status-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
  .status-dot.active { background: var(--accent); box-shadow: 0 0 10px var(--accent); }
  .status-main { font-size: 1rem; font-weight: 600; }
  .status-sub { font-size: 0.8rem; color: var(--muted); }
  
  .table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 600px; }
  th { background: var(--surface2); padding: 10px; font-size: 0.7rem; color: var(--muted); text-transform: uppercase; }
  td { border: 1px solid var(--border); text-align: center; height: 50px; }
  .time-cell { font-family: var(--mono); font-size: 11px; background: var(--surface2); width: 80px; }
  .lesson-cell { font-size: 11px; padding: 4px; }
  .subj { font-weight: 700; display: block; }
  .info { color: var(--muted); font-size: 9px; }
  .active { background: rgba(245,158,11,0.1) !important; color: var(--accent) !important; }
  .lunch-cell { background: rgba(16,185,129,0.05); color: var(--green); font-size: 9px; }
  .weekend-banner { text-align: center; padding: 10px; background: rgba(16,185,129,0.1); color: var(--green); border-radius: 10px; margin-bottom: 15px; }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <h1>FST <span>1</span></h1>
    <div class="clock" id="live-clock">--:--:--</div>
  </div>
  <div class="group-switch">
    <button class="group-btn" id="btn-g1" onclick="setGroup(1)">G1</button>
    <button class="group-btn" id="btn-g2" onclick="setGroup(2)">G2</button>
  </div>
</div>

<div id="weekend-banner" class="weekend-banner" style="display:none">🎉 Wochenende!</div>

<div class="status-card" id="status-card">
  <div class="status-dot" id="status-dot"></div>
  <div class="status-text">
    <div class="status-main" id="status-main">Lade Plan...</div>
    <div class="status-sub" id="status-sub"></div>
  </div>
</div>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>Zeit</th>
        <th id="head-0">Mo</th><th id="head-1">Di</th><th id="head-2">Mi</th><th id="head-3">Do</th><th id="head-4">Fr</th>
      </tr>
    </thead>
    <tbody id="plan-body"></tbody>
  </table>
</div>

<script>
// ── LOGIK FÜR DIE GRUPPEN-UMSCHALTUNG ──────────────────────────
let selectedGroup = parseInt(localStorage.getItem('fst1_group')) || 1;

function setGroup(g) {
  selectedGroup = g;
  localStorage.setItem('fst1_group', g);
  updateUI();
  location.reload(); // Einfachster Weg um alles neu zu zeichnen
}

// Wochen-Rhythmus berechnen (stures Abwechseln ohne Ferien-Stop)
// Referenz: Montag, 23. Feb 2026 ist eine "Gruppe 1 Woche" (Beispiel)
function isAlternatingWeek() {
  const referenceDate = new Date(2026, 1, 23); // 23. Feb 2026
  const now = new Date();
  const diffInMs = now - referenceDate;
  const diffInWeeks = Math.floor(diffInMs / (1000 * 60 * 60 * 24 * 7));
  return Math.abs(diffInWeeks % 2) === 1;
}

// Bestimme, welche Gruppe diese Woche den "Gruppe 1 Plan" hat
const isG1Week = isAlternatingWeek() ? false : true; 
// Wenn du merkst, dass die Wochen vertauscht sind, ändere einfach oben true/false.

// ── DATEN ──────────────────────────────────────────────────────
const PLAN = [
  { type:'hour', nr:1,  start:[8,0],  end:[8,45]  },
  { type:'hour', nr:2,  start:[8,45], end:[9,30]  },
  { type:'pause',       start:[9,30], end:[9,45]  },
  { type:'hour', nr:3,  start:[9,45], end:[10,30] },
  { type:'hour', nr:4,  start:[10,30],end:[11,15] },
  { type:'pause',       start:[11,15],end:[11,30] },
  { type:'hour', nr:5,  start:[11,30],end:[12,15] },
  { type:'hour', nr:6,  start:[12,15],end:[13,0]  },
  { type:'hour', nr:7,  start:[13,0], end:[13,45] },
  { type:'hour', nr:8,  start:[13,45],end:[14,30] },
  { type:'hour', nr:9,  start:[14,30],end:[15,15] },
  { type:'pause',       start:[15,15],end:[15,30] },
  { type:'hour', nr:10, start:[15,30],end:[16,15] },
  { type:'hour', nr:11, start:[16,15],end:[17,0]  },
];

const LUNCH = { 0:8, 1:7, 2:7, 3:5 };

// Basis-Fächer (Gleich für beide)
const BASE_FÄCHER = {
  0: {1:['Baukonstr','E 203','Reißer'], 2:['Baukonstr','E 203','Reißer'], 3:['Bautechno','E 203','Drexler'], 4:['Bautechno','E 203','Drexler'], 5:['Bautechno','E 203','Drexler'], 6:['Wi_PuG','E 203','Seiler'], 7:['Wi_PuG','E 203','Seiler'], 9:['Deutsch','E 202','Schnabel'], 10:['Deutsch','E 203','Schnabel']},
  1: {2:['Statik','E 203','Schäfer'], 3:['Statik','E 203','Schäfer'], 4:['Statik','E 203','Schäfer'], 5:['Englisch','E 203','Finck'], 6:['Englisch','E 203','Finck'], 8:['Bauphysik','E 203','Küsel'], 9:['Bauphysik','E 203','Küsel'], 10:['Bauphysik','E 203','Küsel']},
  2: {1:['Mathe','E 203','Hinte'], 2:['Mathe','E 203','Hinte'], 3:['Baurecht','E 203','Carl'], 4:['Baurecht','E 203','Carl'], 5:['Betr-psych','E 203','Papsdorf'], 6:['Betr-psych','E 203','Papsdorf']},
  3: {6:['Mathe','E 203','Hinte'], 7:['Mathe','E 203','Hinte'], 8:['Mathe','E 203','Hinte']},
  4: {1:['Darst.G','E 203','Schwemmer'], 2:['Darst.G','E 203','Schwemmer'], 3:['Baukonstr','E 203','Reißer'], 4:['Baukonstr','E 203','Reißer']},
};

// Diese Funktion baut den Plan basierend auf der Woche und Gruppe zusammen
function getActiveFach(day, hour) {
  // Checke zuerst Basis-Fächer
  if(BASE_FÄCHER[day] && BASE_FÄCHER[day][hour]) return BASE_FÄCHER[day][hour];

  // Bestimme, ob der User gerade in seiner "Primärwoche" ist
  const isUserInPrimaryWeek = (selectedGroup === 1 && isG1Week) || (selectedGroup === 2 && !isG1Week);

  // Mittwoch (Day 2)
  if (day === 2) {
    if (isUserInPrimaryWeek) {
      if (hour === 8 || hour === 9) return ['CAD','Mix','Sum/Schw'];
      if (hour >= 10) return null; // Schulaus ab 15:15
    } else {
      if (hour === 10 || hour === 11) return ['Vermess','E 203','Schwind'];
    }
  }

  // Donnerstag (Day 3)
  if (day === 3) {
    if (isUserInPrimaryWeek) {
      if (hour === 1) return null; // Beginn 08:45
      if (hour === 2 || hour === 3 || hour === 4) return ['Labor','Mix','Wolf'];
    } else {
      if (hour === 1) return ['EDV','E 203','Reith'];
      if (hour === 2) return ['EDV/Lab','Mix','Reith/Wolf'];
      if (hour === 3 || hour === 4) return ['CAD/Lab','Mix','Sum/Wolf'];
    }
  }

  // Freitag (Day 4)
  if (day === 4) {
    if (isUserInPrimaryWeek) {
      if (hour === 5 || hour === 6) return ['EDV','E 203','Reith'];
    } else {
      if (hour === 5 || hour === 6) return null; // Andere Gruppe hat frei
    }
  }
  return null;
}

// ── UI RENDERING ───────────────────────────────────────────────
function updateUI() {
  document.getElementById('btn-g1').className = 'group-btn' + (selectedGroup === 1 ? ' active' : '');
  document.getElementById('btn-g2').className = 'group-btn' + (selectedGroup === 2 ? ' active' : '');
}

function buildTable() {
  const tbody = document.getElementById('plan-body');
  tbody.innerHTML = '';
  PLAN.forEach((slot, rowIdx) => {
    const tr = document.createElement('tr');
    const tc = document.createElement('td');
    tc.className = 'time-cell';
    tc.innerHTML = slot.type==='hour' ? `${slot.nr}.<br>${slot.start[0]}:${slot.start[1].toString().padStart(2,'0')}` : '—';
    tr.appendChild(tc);

    for (let d = 0; d < 5; d++) {
      const td = document.createElement('td');
      if (slot.type === 'pause') {
        td.className = 'pause-cell';
      } else if (LUNCH[d] === slot.nr) {
        td.className = 'lunch-cell';
        td.innerHTML = 'Mittag';
      } else {
        const info = getActiveFach(d, slot.nr);
        if (info) {
          td.className
