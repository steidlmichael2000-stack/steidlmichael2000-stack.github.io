  <rect x="13.3" y="13"   width="5.4" height="5" rx="1.5" fill="#34d399"/>
  <rect x="20.6" y="13"   width="5.4" height="5" rx="1.5" fill="#34d399" opacity="0.32"/>
  <rect x="6"    y="20.3" width="5.4" height="5" rx="1.5" fill="#34d399" opacity="0.32"/>
  <rect x="13.3" y="20.3" width="5.4" height="5" rx="1.5" fill="#34d399" opacity="0.32"/>
